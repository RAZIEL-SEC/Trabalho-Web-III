name: Deploy para Oracle VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Atualizar aplicação na VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 30s
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            cd /home/ubuntu/Trabalho-Web-III

            git fetch --prune origin main
            git reset --hard origin/main

            # Atualiza somente a aplicação; não reinicia o PostgreSQL.
            docker compose up -d --build --no-deps app

            # A API pode levar alguns segundos para inicializar após o container subir.
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8000/saude >/dev/null; then
                echo "Health check concluído com sucesso."
                docker image prune -f
                exit 0
              fi
              echo "Aguardando a API iniciar (tentativa ${attempt}/30)..."
              sleep 2
            done

            echo "A API não ficou saudável dentro do prazo. Logs para diagnóstico:"
            docker compose ps
            docker compose logs --tail=100 app
            exit 1
