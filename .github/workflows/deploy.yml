name: Deploy para Oracle VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vps-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Testes do backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r backend/requirements.txt
      - name: Executar testes
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
          SECRET_KEY: github-actions-test-secret-key-not-used-in-production
          COOKIE_SECURE: "false"
        run: python -m pytest -q

  deploy:
    name: Atualizar aplicação na VPS
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 30s
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            cd /home/ubuntu/Trabalho-Web-III

            git fetch --prune origin main
            git reset --hard origin/main

            # Atualiza somente a aplicação; não reinicia o PostgreSQL.
            docker compose up -d --build --no-deps app

            # A API pode levar alguns segundos para inicializar após o container subir.
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8000/saude >/dev/null; then
                echo "Health check concluído com sucesso."
                docker image prune -f
                exit 0
              fi
              echo "Aguardando a API iniciar (tentativa ${attempt}/30)..."
              sleep 2
            done

            echo "A API não ficou saudável dentro do prazo. Logs para diagnóstico:"
            docker compose ps
            docker compose logs --tail=100 app
            exit 1
