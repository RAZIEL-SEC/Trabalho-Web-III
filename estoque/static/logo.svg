.word{font-family:Arial,Helvetica,sans-serif;font-weight:900;fill:var(--logo-text,#080d68);stroke:var(--logo-letter-outline,#fff);stroke-width:2.5;paint-order:stroke;letter-spacing:-1.5px}
.heart{fill:var(--logo-heart,#ed101b)}
</style>
