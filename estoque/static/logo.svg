<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="title desc">
<title id="title">Amigos do Zé Alguém</title><desc id="desc">Boné azul com o nome Amigos do Zé Alguém e um coração vermelho.</desc>
<style>
.cap{fill:var(--logo-cap,#08adf2);stroke:var(--logo-outline,#07111b);stroke-width:5;stroke-linejoin:round}
