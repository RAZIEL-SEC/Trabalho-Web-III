<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Itens · Amigos do Zé Alguém</title><link rel="stylesheet" href="static/app.css"></head>
<body>
<div class="layout">
<aside class="sidebar">
  <a class="brand" href="index.html" aria-label="Amigos do Zé Alguém - início"><span class="brand-mark" data-logo></span></a>
  <nav class="menu"><a href="index.html">Visão geral</a><a class="active" href="itens.html">Itens</a><a href="movimentacoes.html">Movimentações</a><a href="historico.html">Histórico</a><a href="usuarios.html" data-so-admin hidden>Usuários</a></nav>
  <div class="side-bottom"><button class="button button-quiet" data-sair>Sair da conta</button></div>
</aside>
<main class="main">
<header class="topbar"><div><p class="eyebrow">CADASTRO</p><h1>Itens do estoque</h1></div><div class="user-chip">Gestão de itens</div></header>
<section class="panel">
  <div class="section-head"><div><p class="eyebrow">NOVO REGISTRO</p><h2>Cadastrar item</h2></div></div>
  <form id="form-item" class="form-grid">
    <label>Nome do item<input name="nome" required maxlength="100" placeholder="Ex.: Arroz"></label>
    <label>Unidade<select name="unidade" required><option value="">Selecione</option><option value="kg">Quilograma (kg)</option><option value="un">Unidade (un)</option><option value="l">Litro (l)</option><option value="pacote">Pacote</option></select></label>
    <div class="form-actions"><button class="button" type="submit">Cadastrar item</button></div>
    <p id="item-msg" class="feedback" role="status"></p>
  </form>
</section>
<section class="panel">
  <div class="section-head"><div><p class="eyebrow">INVENTÁRIO</p><h2>Itens cadastrados</h2><p class="muted">Excluir remove o item da lista ativa, mas mantém o histórico de movimentações.</p></div><button class="button button-outline" id="atualizar-itens" type="button">Atualizar lista</button></div>
  <div class="table-wrap"><table><thead><tr><th>Item</th><th>Unidade</th><th>Saldo</th><th>Situação</th><th>Ações</th></tr></thead><tbody id="itens-lista"><tr><td colspan="5" class="empty">Carregando…</td></tr></tbody></table></div>
</section>
</main>
</div>
<script src="static/brand.js"></script><script src="static/auth.js"></script><script src="static/itens.js"></script>
</body></html>
