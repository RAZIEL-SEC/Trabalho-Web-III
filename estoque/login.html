<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="static/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Entrar · Amigos do Zé Alguém</title>
  <link rel="stylesheet" href="static/login.css">
</head>
<body>
  <main class="cartao">
    <div class="marca marca-logo" data-logo aria-hidden="true"></div>

    <h1>Amigos do Zé Alguém</h1>
    <p class="subtitulo">Área da equipe · controle de estoque</p>

    <p id="aviso" class="aviso" role="status" hidden></p>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required maxlength="150"
               autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email">
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="senha">
          <input id="senha" name="senha" type="password" required maxlength="200"
                 autocomplete="current-password">
          <button type="button" id="ver-senha" class="ver-senha"
                  aria-pressed="false" aria-label="Mostrar senha">Mostrar</button>
        </div>
        <p id="caps" class="dica" hidden>Caps Lock está ativado.</p>
      </div>

      <p id="erro" class="erro" role="alert" hidden></p>

      <button type="submit" id="entrar" class="principal">
        <span class="rotulo"><span class="material-symbols-outlined" aria-hidden="true">login</span>Entrar</span>
      </button>
    </form>

    <p class="rodape">Esqueceu a senha?<br>Peça a um administrador para redefini-la.</p>
  </main>
  <script src="static/brand.js"></script>
  <script src="static/login.js"></script>
</body>
</html>
