<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <meta name="robots" content="noindex">
  <title>Entrar · Amigos do Zé Alguém</title>
  <link rel="icon" type="image/svg+xml" href="static/logo.svg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="static/login.css">
</head>
<body>
  <main class="cartao">
    <div class="marca marca-logo" data-logo></div>
    

    <h1>Amigos do Zé Alguém</h1>
    <p class="subtitulo">Área da equipe · controle de estoque</p>

    <p id="aviso" class="aviso" role="status" hidden></p>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="email"><i class="fa-solid fa-envelope" aria-hidden="true"></i> E-mail</label>
        <input id="email" name="email" type="email" required maxlength="150"
               autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email">
      </div>

      <div class="campo">
        <label for="senha"><i class="fa-solid fa-lock" aria-hidden="true"></i> Senha</label>
        <div class="senha">
          <input id="senha" name="senha" type="password" required maxlength="200"
                 autocomplete="current-password">
          <button type="button" id="ver-senha" class="ver-senha"
                  aria-pressed="false" aria-label="Mostrar senha">Mostrar</button>
        </div>
        <p id="caps" class="dica" hidden>Caps Lock está ativado.</p>
      </div>

      <p id="erro" class="erro" role="alert" hidden></p>

      <button type="submit" id="entrar" class="principal">
        <span class="rotulo"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Entrar</span>
      </button>
    </form>

    <p class="rodape">Esqueceu a senha?<br>Peça a um administrador para redefini-la.</p>
  </main>
  
  <script src="static/brand.js"></script>
  <script src="static/login.js"></script>
</body>
</html>
