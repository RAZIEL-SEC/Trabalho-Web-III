services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque_dev
      POSTGRES_DB: estoque
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,Z
volumes:
  pgdata: